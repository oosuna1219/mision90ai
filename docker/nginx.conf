server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # trailingSlash:true → cada ruta es carpeta/index.html.
    # Intenta el archivo, luego la carpeta, luego .html, y si no, index.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache largo para los assets con hash de Next (/_next/static).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
